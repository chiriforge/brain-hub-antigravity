name: Conductor Secret Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog OSS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CANDIDATE="$PR_BASE_SHA"
          else
            CANDIDATE="$PUSH_BEFORE_SHA"
          fi

          MB=""
          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null; then
            MB=$(git merge-base "$CANDIDATE" "$HEAD_SHA" 2>/dev/null || true)
          fi

          if [ -n "$MB" ] && [ "$MB" != "$HEAD_SHA" ]; then
            echo "base=$MB" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: HEAD
